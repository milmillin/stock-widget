name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-config.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generate site/config.js from repo config. WORKER_BASE_URL and PUBLIC_KEY are
      # PUBLIC (they ship in the static site); store them as Actions variables or
      # secrets. NEVER put PRIVATE_KEY here — it must stay a Cloudflare Worker secret.
      - name: Build site/config.js
        run: node scripts/build-config.mjs
        env:
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL || secrets.WORKER_BASE_URL }}
          PUBLIC_KEY: ${{ vars.PUBLIC_KEY || secrets.PUBLIC_KEY }}

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
